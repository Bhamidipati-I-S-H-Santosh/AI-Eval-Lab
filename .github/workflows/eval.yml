name: Tests and evals

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" button for the agent eval

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-ci.txt
      # Unit + end-to-end tests: tools, agent loop, evalkit adapters, MCP proxy (no API key)
      - run: python -m pytest -q
      # evalkit quality gate on the vector-DB path (hash embedder: no model download)
      - run: python examples/load_qdrant.py --embedder hash:256
      - run: python -m evalkit run examples/qdrant_retrieval.yaml
      # Quality gate: fails the build if retrieval quality drops below the bar
      - run: python -m src.evaluate --retrieval-only --method bm25 --min-hit-rate 0.85 --no-save

  # Optional: full agent eval with a real LLM. Add LLM_API_KEY under
  # Settings > Secrets and variables > Actions, then run it from the Actions tab.
  agent-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: llama-3.3-70b-versatile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-ci.txt
      - run: python -m src.eval_agent
      - run: python -m evalkit run examples/northwind.yaml
