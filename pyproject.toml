[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
dynamic = ["version"]
description = "Vendor-neutral evaluation platform for AI agents, RAG systems and retrievers"
readme = "EVALKIT.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bhamidipati I S H Santosh" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]
# The core has no vendor SDKs: every integration is an optional extra, imported
# only when a config uses it.
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "pydantic>=2.5",
  "cryptography>=42",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
azure = ["openai>=1.40", "azure-identity>=1.15", "azure-keyvault-secrets>=4.7", "azure-storage-blob>=12.19",
         "azure-ai-projects>=1.0", "azure-ai-agents>=1.0"]
aws = ["boto3>=1.34"]
gcp = ["google-auth>=2.25", "google-genai>=1.0", "google-cloud-storage>=2.14", "google-cloud-secret-manager>=2.18"]
postgres = ["psycopg[binary]>=3.1"]
pgvector = ["psycopg[binary]>=3.1"]
qdrant = ["qdrant-client>=1.10"]
pinecone = ["pinecone>=5.0"]
weaviate = ["weaviate-client>=4.4"]
elasticsearch = []          # REST over requests; no SDK needed
mcp = ["mcp>=1.0"]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
crewai = ["crewai>=0.30"]
semantic-kernel = ["semantic-kernel>=1.0"]
otel = ["opentelemetry-proto>=1.20", "protobuf>=4.25"]
server = ["starlette>=0.37", "uvicorn>=0.29", "pyjwt[crypto]>=2.8", "httpx>=0.27", "itsdangerous>=2.1"]
dashboard = ["streamlit>=1.30", "pandas>=2.0"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "starlette>=0.37", "uvicorn>=0.29", "pyjwt[crypto]>=2.8", "itsdangerous>=2.1",
       "openai>=1.40", "mcp>=1.0", "qdrant-client>=1.10", "opentelemetry-sdk>=1.25",
       "opentelemetry-exporter-otlp-proto-http>=1.25"]
all = ["evalkit[openai,anthropic,azure,aws,gcp,postgres,qdrant,pinecone,weaviate,mcp,otel,server,dashboard]"]

[project.scripts]
evalkit = "evalkit.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "evalkit.__version__" }

[tool.setuptools.packages.find]
include = ["evalkit*"]

[tool.setuptools.package-data]
evalkit = ["py.typed", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: needs real credentials or a local service (skipped unless EVALKIT_LIVE=1)",
]
