<style>
/* ---------- tokens (reference palette; dark steps selected, not flipped) ---------- */
:root {
  color-scheme: light;
  --page: #f6f6f4; --surface: #ffffff; --surface-2: #f9f9f8; --sunken: #f1f1ef;
  --ink: #191919; --ink-2: #555552; --ink-3: #6b6b67; --line: #e7e7e4; --line-2: #d6d6d2;
  --axis: #c2c2c2; --grid: #ececea;
  --accent: #2370cd; --accent-ink: #1b64be; --accent-wash: #e8f1fc; --accent-track: #cce3fd;
  --s1: #257de0; --s2: #f47230; --s3: #00b894; --s4: #f2a600;
  --good: #0aac23; --good-ink: #006c10; --good-wash: #e7f6e9;
  --warn: #fbb315; --warn-ink: #8a5a00; --warn-wash: #fff5dc;
  --serious: #f18a59;
  --crit: #dc3c3d; --crit-ink: #b42324; --crit-wash: #fdecec;
  --shadow: 0 1px 2px rgba(16,16,14,.05), 0 1px 1px rgba(16,16,14,.03);
  --shadow-lg: 0 12px 32px rgba(16,16,14,.14), 0 2px 6px rgba(16,16,14,.06);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0f0f0e; --surface: #191918; --surface-2: #1e1e1d; --sunken: #141413;
    --ink: #efefec; --ink-2: #b4b4af; --ink-3: #9c9c97; --line: #2c2c2a; --line-2: #3a3a37;
    --axis: #474747; --grid: #262624;
    --accent: #519ced; --accent-ink: #84b9f3; --accent-wash: #142336; --accent-track: #1d3554;
    --s1: #338ced; --s2: #e76624; --s3: #00a888; --s4: #d28e05;
    --good: #0aac23; --good-ink: #53c556; --good-wash: #10261a;
    --warn: #fbb315; --warn-ink: #f3c45a; --warn-wash: #2b2412;
    --crit: #dc3c3d; --crit-ink: #f07f80; --crit-wash: #301617;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f0f0e; --surface: #191918; --surface-2: #1e1e1d; --sunken: #141413;
  --ink: #efefec; --ink-2: #b4b4af; --ink-3: #9c9c97; --line: #2c2c2a; --line-2: #3a3a37;
  --axis: #474747; --grid: #262624;
  --accent: #519ced; --accent-ink: #84b9f3; --accent-wash: #142336; --accent-track: #1d3554;
  --s1: #338ced; --s2: #e76624; --s3: #00a888; --s4: #d28e05;
  --good: #0aac23; --good-ink: #53c556; --good-wash: #10261a;
  --warn: #fbb315; --warn-ink: #f3c45a; --warn-wash: #2b2412;
  --crit: #dc3c3d; --crit-ink: #f07f80; --crit-wash: #301617;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--page); color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: var(--accent-ink); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .small { font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.brand-name { font-weight: 650; font-size: 15.5px; letter-spacing: -.1px; }
.brand-ver { margin-left: auto; font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 20px; padding: 0 7px; }
.nav { padding: 6px 10px; overflow-y: auto; flex: 1; }
.nav-h { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-3); padding: 14px 10px 6px; font-weight: 600; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: var(--ink-2); font-weight: 500; text-decoration: none; }
.nav a svg { width: 17px; height: 17px; flex: none; stroke: currentColor; }
.nav a:hover { background: var(--sunken); color: var(--ink); }
.nav a.on { background: var(--accent-wash); color: var(--accent-ink); }
.nav .count { margin-left: auto; font-size: 11.5px; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 7px; font-weight: 600; }
.me { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-wash); color: var(--accent-ink); display: grid; place-items: center; font-weight: 650; font-size: 12.5px; flex: none; }
.me-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-role { font-size: 11.5px; color: var(--ink-3); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 28px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-3); min-width: 0; }
.crumbs b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.env { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--line-2); color: var(--ink-2); }
.content { padding: 24px 28px 60px; max-width: 1360px; width: 100%; }
.page-h { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-h h1 { font-size: 21px; margin: 0; letter-spacing: -.2px; font-weight: 650; }
.page-h p { margin: 3px 0 0; color: var(--ink-3); }
.page-h .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-h h2 { font-size: 14.5px; margin: 0; font-weight: 600; }
.card-h .sub { color: var(--ink-3); font-size: 12.5px; }
.card-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-b { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.g-tiles { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.g-2 { grid-template-columns: 2fr 1fr; } .g-2e { grid-template-columns: 1fr 1fr; }
@media (max-width: 1100px) { .g-2, .g-2e { grid-template-columns: 1fr; } }
.stack > * + * { margin-top: 16px; }

.tile { padding: 16px 18px; }
.tile-l { color: var(--ink-3); font-size: 12.5px; font-weight: 500; }
.tile-v { font-size: 26px; font-weight: 650; letter-spacing: -.4px; margin-top: 4px; display: flex; align-items: baseline; gap: 8px; }
.tile-d { font-size: 12.5px; font-weight: 600; }
.tile-f { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--ink-3); font-size: 12px; }
.up-good { color: var(--good-ink); } .down-bad { color: var(--crit-ink); }

.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { background: var(--sunken); text-decoration: none; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunken); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.btn:disabled { opacity: .5; cursor: default; }
.input, select.input { height: 34px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; background: var(--surface); min-width: 0; }
.input:focus { outline: 2px solid var(--accent-track); border-color: var(--accent); }
.search { position: relative; } .search svg { position: absolute; left: 10px; top: 9px; width: 16px; height: 16px; stroke: var(--ink-3); }
.search .input { padding-left: 32px; width: 260px; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 12px; height: 32px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.on { background: var(--accent-wash); color: var(--accent-ink); }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.badge svg { width: 13px; height: 13px; }
.b-good { background: var(--good-wash); color: var(--good-ink); }
.b-bad { background: var(--crit-wash); color: var(--crit-ink); }
.b-warn { background: var(--warn-wash); color: var(--warn-ink); }
.b-info { background: var(--accent-wash); color: var(--accent-ink); }
.b-mute { background: var(--sunken); color: var(--ink-2); border-color: var(--line); }
.chip { display: inline-block; padding: 0 8px; border-radius: 6px; background: var(--sunken); border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); margin: 0 4px 4px 0; }

table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
.t th.sortable { cursor: pointer; user-select: none; } .t th.sortable:hover { color: var(--ink); }
.t td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr.click { cursor: pointer; } .t tbody tr.click:hover td { background: var(--surface-2); }
.t td.r, .t th.r { text-align: right; }
.t .wrap { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table-scroll { overflow-x: auto; }
.empty { padding: 44px 20px; text-align: center; color: var(--ink-3); }
.empty svg { width: 34px; height: 34px; stroke: var(--line-2); margin-bottom: 8px; }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; font-size: 14.5px; }

.meter { display: flex; align-items: center; gap: 10px; }
.meter .track { flex: 1; height: 6px; border-radius: 3px; background: var(--accent-track); overflow: hidden; min-width: 60px; }
.meter .fill { height: 100%; border-radius: 3px; background: var(--accent); }
.meter.bad .track { background: var(--crit-wash); } .meter.bad .fill { background: var(--crit); }
.meter.warn .track { background: var(--warn-wash); } .meter.warn .fill { background: var(--warn); }
.meter span { min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 550; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; }
.tabs button { border: 0; background: none; padding: 12px 12px 10px; cursor: pointer; color: var(--ink-3); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .n { font-size: 11.5px; background: var(--sunken); border-radius: 10px; padding: 0 6px; margin-left: 4px; color: var(--ink-2); }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius); border: 1px solid; }
.banner svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.banner.good { background: var(--good-wash); border-color: color-mix(in srgb, var(--good) 35%, transparent); color: var(--good-ink); }
.banner.bad { background: var(--crit-wash); border-color: color-mix(in srgb, var(--crit) 35%, transparent); color: var(--crit-ink); }
.banner.warn { background: var(--warn-wash); border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn-ink); }
.banner.info { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent-ink); }
.banner ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink); }

.progress { height: 8px; background: var(--accent-track); border-radius: 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s ease; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 16px; font-size: 13.5px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; word-break: break-all; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,10,9,.35); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .15s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 96vw); background: var(--surface); z-index: 41; box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; }
.drawer.on { transform: none; }
.drawer-h { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.drawer-h h3 { margin: 0; font-size: 15.5px; }
.drawer-b { padding: 18px 20px; overflow-y: auto; flex: 1; }
.sec { margin-bottom: 20px; } .sec h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-3); }
.quote { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
.step { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
.step-h { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--surface-2); font-weight: 600; font-size: 13px; }
.step-b { padding: 8px 12px; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; color: var(--ink-2); }

/* modal & toast */
.modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: rgba(10,10,9,.35); }
.modal .card { width: min(460px, 94vw); box-shadow: var(--shadow-lg); }
.field { display: grid; gap: 6px; margin-bottom: 14px; } .field label { font-weight: 550; font-size: 13px; }
.field .hint { font-size: 12px; color: var(--ink-3); }
.toasts { position: fixed; bottom: 20px; right: 20px; z-index: 60; display: grid; gap: 8px; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow-lg); max-width: 380px; font-size: 13.5px; }
.toast.bad { background: var(--crit); color: #fff; }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login .card { width: min(400px, 100%); padding: 28px; }
.login h1 { font-size: 20px; margin: 16px 0 4px; }

/* ---------- charts ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--ink-2); font-size: 11.5px; font-weight: 600; }
.chart .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .xhair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .ci { stroke: var(--accent); stroke-width: 2; stroke-linecap: round; opacity: .45; }
.chart .ci-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .row-bg, .chart .row-bg.hov { fill: var(--sunken); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 140px; z-index: 4; display: none; }
.tip .tip-h { color: var(--ink-3); margin-bottom: 4px; font-size: 11.5px; }
.tip .tip-r { display: flex; align-items: center; gap: 8px; } .tip .tip-r b { font-variant-numeric: tabular-nums; }
.tip .key { width: 14px; height: 2px; border-radius: 1px; flex: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.spark { display: block; }
</style>
</head>

/* ============================================================ charts */
const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
function niceMax(v) { if (v <= 1) return 1; const p = 10 ** Math.floor(Math.log10(v)); return Math.ceil(v / p) * p; }

/** Line chart with crosshair tooltip, direct end labels, legend (>=2 series), table toggle.
 *  series: [{name, points: [{x: Date, y: number, meta}]}] */
function lineChart(el, series, {height = 240, yFmt = pct, yMax = null, rate = true} = {}) {
  series = series.filter(s => s.points.length);
  if (!series.length) { el.innerHTML = `<div class="empty">${icon("chart")}<b>No data yet</b>Runs will appear here.</div>`; return; }
  const W = Math.max(320, el.clientWidth || 640), H = height, m = {l: 44, r: 124, t: 12, b: 26};
  const xs = series.flatMap(s => s.points.map(p => +p.x)), ys = series.flatMap(s => s.points.map(p => p.y));
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 3600e3; x1 += 3600e3; }
  const y1 = yMax ?? (rate ? 1 : niceMax(Math.max(...ys) * 1.1)), y0 = 0;
  const X = x => m.l + (x - x0) / (x1 - x0) * (W - m.l - m.r), Y = y => m.t + (1 - (y - y0) / (y1 - y0)) * (H - m.t - m.b);
  const ticks = [0, .25, .5, .75, 1].map(f => y0 + f * (y1 - y0));
  const nx = Math.min(5, new Set(xs).size);
  const xt = Array.from({length: nx}, (_, i) => x0 + (nx === 1 ? .5 : i / (nx - 1)) * (x1 - x0));
  const span = x1 - x0, df = span > 3 * 864e5 ? {month: "short", day: "numeric"} : {hour: "2-digit", minute: "2-digit"};
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map(s => s.name).join(", "))} over time">`;
  ticks.forEach(t => svg += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(yFmt(t))}</text>`);
  svg += `<line class="baseline" x1="${m.l}" x2="${W - m.r}" y1="${Y(y0)}" y2="${Y(y0)}"/>`;
  xt.forEach(t => svg += `<text class="tick" x="${X(t)}" y="${H - 6}" text-anchor="middle">${esc(new Date(t).toLocaleString([], df))}</text>`);
  const labelYs = [];
  series.forEach((s, i) => {
    const pts = [...s.points].sort((a, b) => a.x - b.x), c = SERIES[i % SERIES.length];
    svg += `<path class="series" stroke="${c}" d="${pts.map((p, j) => (j ? "L" : "M") + X(+p.x).toFixed(1) + "," + Y(p.y).toFixed(1)).join("")}"/>`;
    pts.forEach(p => svg += `<circle class="dot" cx="${X(+p.x)}" cy="${Y(p.y)}" r="4" fill="${c}"/>`);
    const last = pts[pts.length - 1]; let ly = Y(last.y) + 4;
    while (labelYs.some(v => Math.abs(v - ly) < 13)) ly += 13; labelYs.push(ly);
    svg += `<text class="lbl" x="${X(+last.x) + 8}" y="${ly}">${esc(s.name.length > 17 ? s.name.slice(0, 16) + "…" : s.name)}</text>`;
  });
  svg += `<line class="xhair" y1="${m.t}" y2="${H - m.b}" style="display:none"/><rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" tabindex="0"/></svg>`;
  const legend = series.length > 1 ? `<div class="legend">${series.map((s, i) => `<span><i style="background:${SERIES[i % 4]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  el.innerHTML = `${legend}<div class="chart">${svg}<div class="tip"></div></div>`;
  const root = $(".chart", el), tip = $(".tip", root), xh = $(".xhair", root), hit = $(".hit", root), svgEl = $("svg", root);
  const allX = [...new Set(xs)].sort((a, b) => a - b);
  function show(px) {
    const rect = svgEl.getBoundingClientRect(), sx = (px - rect.left) * W / rect.width;
    const xv = x0 + (sx - m.l) / (W - m.l - m.r) * (x1 - x0);
    const near = allX.reduce((a, b) => Math.abs(b - xv) < Math.abs(a - xv) ? b : a);
    xh.setAttribute("x1", X(near)); xh.setAttribute("x2", X(near)); xh.style.display = "";
    tip.replaceChildren();
    const h = document.createElement("div"); h.className = "tip-h"; h.textContent = new Date(near).toLocaleString(); tip.appendChild(h);
    series.forEach((s, i) => {
      const p = s.points.find(q => +q.x === near); if (!p) return;
      const r = document.createElement("div"); r.className = "tip-r";
      const k = document.createElement("i"); k.className = "key"; k.style.background = SERIES[i % 4];
      const b = document.createElement("b"); b.textContent = yFmt(p.y);

  hit.addEventListener("focus", () => { const r = svgEl.getBoundingClientRect(); show(r.right - 4); });
  hit.addEventListener("blur", () => { tip.style.display = "none"; xh.style.display = "none"; });
}

/** Dot + 95% interval per metric on a 0–100% scale (one series: no legend). */
function intervalChart(el, rows) {
  if (!rows.length) { el.innerHTML = `<div class="empty">No rate metrics.</div>`; return; }
  const W = Math.max(360, el.clientWidth || 640), rowH = 30, m = {l: 150, r: 64, t: 8, b: 26}, H = m.t + m.b + rows.length * rowH;
  const X = v => m.l + v * (W - m.l - m.r);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Metric scores with 95% confidence intervals">`;
  [0, .25, .5, .75, 1].forEach(t => svg += `<line class="gridline" x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${H - m.b}"/><text class="tick" x="${X(t)}" y="${H - 8}" text-anchor="middle">${t * 100}%</text>`);
  rows.forEach((r, i) => {
    const ci = r.ci95 || r.ci, cy = m.t + i * rowH + rowH / 2, lo = ci ? ci[0] : r.mean, hi = ci ? ci[1] : r.mean;
    svg += `<rect class="row-bg" x="0" y="${cy - rowH / 2}" width="${W}" height="${rowH}" fill="transparent" rx="4"/>`;
    svg += `<text class="tick" x="${m.l - 12}" y="${cy + 4}" text-anchor="end" style="fill:var(--ink-2);font-size:12px">${esc(lab(r.metric))}${LOWER_BETTER.has(r.metric) ? " ↓" : ""}</text>`;
    if (hi > lo) svg += `<line class="ci" x1="${X(lo)}" x2="${X(hi)}" y1="${cy}" y2="${cy}"/>`;
    svg += `<circle class="ci-dot" cx="${X(r.mean)}" cy="${cy}" r="5"/>`;
    svg += `<text class="tick" x="${W - m.r + 10}" y="${cy + 4}" style="fill:var(--ink);font-weight:600">${pct(r.mean)}</text>`;
    svg += `<rect class="hit" data-i="${i}" x="0" y="${cy - rowH / 2}" width="${W}" height="${rowH}" tabindex="0"/>`;
  });
  svg += `</svg>`;
  el.innerHTML = `<div class="chart">${svg}<div class="tip"></div></div>`;
  const root = $(".chart", el), tip = $(".tip", root), svgEl = $("svg", root), bgs = $$(".row-bg", root);
  $$(".hit", root).forEach(h => {
    const on = () => {
      const r = rows[+h.dataset.i], rect = svgEl.getBoundingClientRect();
      bgs.forEach((b, j) => b.classList.toggle("hov", j === +h.dataset.i));
      tip.replaceChildren();
      const t = document.createElement("div"); t.className = "tip-h"; t.textContent = lab(r.metric); tip.appendChild(t);
      const v = document.createElement("div"); v.className = "tip-r"; const b = document.createElement("b"); b.textContent = pct(r.mean);
      const s = document.createElement("span"); s.className = "muted"; const ci = r.ci95 || r.ci; s.textContent = `n=${r.n}` + (ci ? ` · 95% CI ${pct(ci[0])}–${pct(ci[1])}` : "");
      v.append(b, s); tip.appendChild(v); tip.style.display = "block";
      tip.style.left = Math.min(X(r.mean) / W * rect.width + 12, rect.width - tip.offsetWidth - 4) + "px";
      tip.style.top = (+h.getAttribute("y") / H * rect.height + 30) + "px";
    };
    const off = () => { tip.style.display = "none"; bgs.forEach(b => b.classList.remove("hov")); };
    h.addEventListener("pointerenter", on); h.addEventListener("focus", on);
    h.addEventListener("pointerleave", off); h.addEventListener("blur", off);
  });
}

function sparkline(values, w = 96, h = 28) {
  const v = values.filter(x => x != null); if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), r = hi - lo || 1;

function deltaHtml(cur, prev, m) {

  const recent = scored.slice(0, 20), passRate = recent.length ? recent.filter(r => r.gates === "PASSED").length / recent.length : null;
  const series = name => scored.filter(r => r.name === name).reverse();
  const lastWin = mon.windows[mon.windows.length - 1];
  const active = jobs.jobs.filter(j => j.status === "running" || j.status === "queued").length + runs.filter(r => r.status === "running").length;
  const v = $("#view");
  v.innerHTML = `<div class="page-h"><div><h1>Overview</h1><p>Quality, safety and reliability across every evaluated system.</p></div>

        deltaHtml(latInj?.headline.injection_resisted, prevInj?.headline.injection_resisted, "injection_resisted"),
        latInj ? `<span>${esc(latInj.name)} · ${ago(latInj.t)}</span>` : "<span>no attack tests yet</span>")}

        <div class="right"><button class="btn sm js-toggle"></button></div></div><div class="card-b js-viz"></div></div>

    </div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h2>Recent runs</h2><div class="right"><a class="btn sm" href="#/runs">View all</a></div></div>
      <div class="table-scroll">${runsTable(runs.slice(0, 8))}</div></div>`;
  const names = [...new Set(scored.map(r => r.name))].slice(0, 4);
  const trendSeries = names.map(n => ({name: n, points: series(n).filter(r => r.headline.task_success != null && r.t).map(r => ({x: r.t, y: r.headline.task_success, meta: r.gates === "FAILED" ? "gates failed" : ""}))}));

    trendSeries.flatMap(s => s.points.map(p => `<tr><td>${esc(s.name)}</td><td class="mono">${esc(fullTime(p.x))}</td><td>${ago(p.x)}</td><td class="r num">${pct(p.y)}</td></tr>`)).join("")}</tbody></table>`);
  const att = [];
  const latestByName = {}; scored.forEach(r => { if (!latestByName[r.name]) latestByName[r.name] = r; });
  Object.values(latestByName).filter(r => r.gates === "FAILED").slice(0, 4).forEach(r => att.push(`<div class="banner bad" style="margin-bottom:10px">${icon("x")}<div><a href="#/runs/${encodeURIComponent(r.run_id)}"><b>${esc(r.name)}</b></a> failed gates ${ago(r.t)}<ul>${(r.gate_failures || []).slice(0, 3).map(f => `<li>${esc(f)}</li>`).join("")}</ul></div></div>`));
  (lastWin?.alerts || []).forEach(a => att.push(`<div class="banner warn" style="margin-bottom:10px">${icon("alert")}<div><b>${esc(lab(a.metric))}</b> regressed in production (${esc(a.scope)}): ${fmtMetric(a.metric, a.previous)} → ${fmtMetric(a.metric, a.current)}</div></div>`));
  runs.filter(r => r.status === "incomplete").slice(0, 3).forEach(r => att.push(`<div class="banner warn" style="margin-bottom:10px">${icon("alert")}<div><a href="#/runs/${encodeURIComponent(r.run_id)}"><b>${esc(r.name)}</b></a> stopped early: ${esc(r.stop_reason || "")}</div></div>`));
  $("#attention").innerHTML = att.join("") || `<div class="banner good">${icon("check")}<div><b>All clear.</b> No failing gates, incomplete runs or production alerts.</div></div>`;
  $("#newrun")?.addEventListener("click", newRunModal);
  bindRunRows(v);
}
function tile(label, value, delta, foot) {

}

  const opts = sel => runs.map(r => `<option value="${esc(r.run_id)}" ${r.run_id === sel ? "selected" : ""}>${esc(r.name)} · ${esc(ago(r.t))} · ${esc(r.run_id)}</option>`).join("");

    <div class="card" style="margin-bottom:16px"><div class="filters" style="border:0">
      <label class="small muted">Baseline (A)</label><select class="input" id="ca" style="max-width:420px"><option value="">Choose…</option>${opts(a)}</select>
      <label class="small muted">Candidate (B)</label><select class="input" id="cb" style="max-width:420px"><option value="">Choose…</option>${opts(b)}</select></div></div><div id="cres"></div>`;
  const go = () => { const A = $("#ca").value, B = $("#cb").value; if (A && B) location.hash = `#/compare?a=${encodeURIComponent(A)}&b=${encodeURIComponent(B)}`; };
  $("#ca").onchange = go; $("#cb").onchange = go;
  if (!a || !b) { $("#cres").innerHTML = `<div class="card"><div class="empty">${icon("compare")}<b>Pick two runs</b>Usually the same config before and after a change.</div></div>`; return; }
  const c = await api(`/api/v1/compare?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
  const rows = c.metrics.filter(m => m.a != null || m.b != null);
  const worse = rows.filter(m => m.verdict === "WORSE"), better = rows.filter(m => m.verdict === "better");
  const verdict = m => m.verdict === "better" ? `<span class="badge b-good">${icon("check")}Better</span>` : m.verdict === "WORSE" ? `<span class="badge b-bad">${icon("x")}Worse</span>`
    : m.verdict === "n.s." ? `<span class="badge b-mute" title="Not significant: could be noise">Not significant</span>`
    : `<span class="muted small" title="The paired test only uses cases scored in both runs">${m.verdict === "same" ? "No change on shared cases" : "–"}</span>`;
  const rate = rows.filter(m => RATE.has(m.metric) && m.a != null && m.b != null);
  $("#cres").innerHTML = `${worse.length ? `<div class="banner bad" style="margin-bottom:16px">${icon("x")}<div><b>Significant regression${worse.length > 1 ? "s" : ""}:</b> ${worse.map(m => esc(lab(m.metric))).join(", ")}</div></div>`
      : `<div class="banner ${better.length ? "good" : "info"}" style="margin-bottom:16px">${icon(better.length ? "check" : "info")}<div>${better.length ? `<b>Significant improvement:</b> ${better.map(m => esc(lab(m.metric))).join(", ")}. ` : ""}No significant regressions.</div></div>`}
    <div class="card" id="dumb" style="margin-bottom:16px"><div class="card-h"><h2>Rates, baseline vs candidate</h2><div class="right"><button class="btn sm js-toggle"></button></div></div><div class="card-b js-viz"></div></div>
    <div class="card"><div class="table-scroll"><table class="t"><thead><tr><th>Metric</th><th class="r">A</th><th class="r">B</th><th class="r">Change</th><th class="r">Cases better / worse</th><th class="r">p</th><th>Verdict</th></tr></thead><tbody>${
      rows.map(m => `<tr><td>${esc(lab(m.metric))}${LOWER_BETTER.has(m.metric) ? ' <span class="muted">↓</span>' : ""}</td><td class="r num">${fmtMetric(m.metric, m.a)}</td><td class="r num">${fmtMetric(m.metric, m.b)}</td>
        <td class="r num">${m.delta == null ? "–" : (m.delta > 0 ? "+" : "") + (RATE.has(m.metric) ? (m.delta * 100).toFixed(1) + " pts" : m.metric === "latency_s" ? fix(m.delta, 1) + " s" : fix(m.delta, 2))}</td>
        <td class="r num">${m.n ? `${m.wins} / ${m.losses} <span class="muted">of ${m.n}</span>` : "–"}</td><td class="r num">${m.p == null ? "–" : m.p < .001 ? "<0.001" : fix(m.p, 3)}</td><td>${verdict(m)}</td></tr>`).join("")}</tbody></table></div></div>`;
  tableToggle($("#dumb"), body => dumbbell(body, rate), () => `<table class="t"><thead><tr><th>Metric</th><th class="r">A</th><th class="r">B</th></tr></thead><tbody>${rate.map(m => `<tr><td>${esc(lab(m.metric))}</td><td class="r num">${pct(m.a)}</td><td class="r num">${pct(m.b)}</td></tr>`).join("")}</tbody></table>`);
}
function dumbbell(el, rows) {
  if (!rows.length) { el.innerHTML = `<div class="empty">No shared rate metrics.</div>`; return; }
  const W = Math.max(360, el.clientWidth || 640), rowH = 28, m = {l: 150, r: 24, t: 6, b: 26}, H = m.t + m.b + rows.length * rowH, X = v => m.l + v * (W - m.l - m.r);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Baseline versus candidate">`;
  [0, .25, .5, .75, 1].forEach(t => s += `<line class="gridline" x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${H - m.b}"/><text class="tick" x="${X(t)}" y="${H - 8}" text-anchor="middle">${t * 100}%</text>`);
  rows.forEach((r, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    s += `<text class="tick" x="${m.l - 12}" y="${cy + 4}" text-anchor="end" style="fill:var(--ink-2);font-size:12px">${esc(lab(r.metric))}</text>`;
    s += `<line x1="${X(r.a)}" x2="${X(r.b)}" y1="${cy}" y2="${cy}" stroke="var(--line-2)" stroke-width="2"/>`;
    s += `<circle cx="${X(r.a)}" cy="${cy}" r="7" fill="var(--surface)" stroke="var(--s1)" stroke-width="2.5"><title>A: ${pct(r.a)}</title></circle>`;
    s += `<circle cx="${X(r.b)}" cy="${cy}" r="3.5" fill="var(--s2)"><title>B: ${pct(r.b)}</title></circle>`;
  });
  el.innerHTML = `<div class="legend"><span><svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="var(--s1)" stroke-width="2.5"/></svg>A (baseline)</span><span><svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3.5" fill="var(--s2)"/></svg>B (candidate)</span></div><div class="chart">${s}</svg></div>`;
}

    const k = $("#ak").value, q = $("#aq").value.toLowerCase();
    const rows = events.filter(e => (!k || e.event === k) && (!q || JSON.stringify(e).toLowerCase().includes(q)));
    $("#atbl").innerHTML = rows.length ? `<table class="t"><thead><tr><th>Time</th><th>Actor</th><th>Event</th><th>Details</th></tr></thead><tbody>${rows.slice(0, 300).map(e => {
      const {ts, actor, event, prev, hash, ...rest} = e;
      return `<tr><td class="num small" title="${esc(ts)}">${esc(fullTime(new Date(ts)))}</td><td>${esc(actor)}</td><td><span class="chip mono">${esc(event)}</span></td>
        <td class="small muted">${Object.entries(rest).map(([kk, vv]) => `<span class="mono">${esc(kk)}</span>=${esc(typeof vv === "object" ? JSON.stringify(vv) : vv)}`).join(" · ")}</td></tr>`;
    }).join("")}</tbody></table>` : `<div class="empty">No events match.</div>`;
  };
  $("#ak").onchange = draw; $("#aq").oninput = draw; draw();
}

/* ============================================================ router */
async function route() {
  clearTimers(); closeDrawer();
  if (!state.me) return;
  const [path, qs] = (location.hash.slice(1) || "/").split("?");
  const params = new URLSearchParams(qs || "");
  const v = $("#view"); v.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    if (path === "/" || path === "") await viewOverview();
    else if (path === "/runs") await viewRuns();
    else if (path.startsWith("/runs/")) await viewRun(decodeURIComponent(path.slice(6)));
    else if (path === "/compare") await viewCompare(params);
    else if (path === "/jobs") await viewJobs();
    else if (path === "/datasets") await viewDatasets();
    else if (path === "/monitoring") await viewMonitoring();
    else if (path === "/plugins") await viewPlugins();
    else if (path === "/audit") await viewAudit();
    else v.innerHTML = `<div class="card"><div class="empty"><b>Page not found</b><a href="#/">Back to overview</a></div></div>`;
  } catch (e) {
    if (e.message !== "Sign-in required") v.innerHTML = `<div class="banner bad">${icon("alert")}<div><b>Something went wrong.</b> ${esc(e.message)}</div></div>`;
  }
}
window.addEventListener("hashchange", route);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if ($(".js-viz")) route(); }, 250); });

(async () => {
  const saved = localStorage.getItem("evalkit_theme"); if (saved) document.documentElement.dataset.theme = saved;
  const headers = state.apiKey ? {"x-api-key": state.apiKey} : {};
  try {
    const r = await fetch("/api/v1/me", {credentials: "same-origin", headers});
    const me = await r.json();
    if (!me.authenticated) return renderLogin();
    state.me = me; shell(); route();
  } catch { renderLogin(); }
})();
</script>
