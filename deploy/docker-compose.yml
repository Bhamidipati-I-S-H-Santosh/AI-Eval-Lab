# Single-host deployment: evalkit server + an OpenTelemetry Collector that
# forwards your agents' traces to it.  docker compose -f deploy/docker-compose.yml up -d
services:
  evalkit:
    build: {context: .., args: {EXTRAS: "server,openai"}}
    image: evalkit:0.2.0
    ports: ["8080:8080"]
    env_file: [../.env]                      # OIDC_*, EVALKIT_*_KEY, LLM keys; never baked into the image
    volumes:
      - ./examples:/etc/evalkit:ro
      - evalkit-data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]                     # agents export OTLP/HTTP here
    environment:
      EVALKIT_INGEST_KEY: ${EVALKIT_INGEST_KEY}
    depends_on: [evalkit]

volumes:
  evalkit-data: {}
