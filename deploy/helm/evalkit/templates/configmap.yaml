apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "evalkit.fullname" . }}
  labels: {{- include "evalkit.labels" . | nindent 4 }}
data:
  server.yaml: |
{{ .Values.serverConfig | indent 4 }}
{{- range $name, $body := .Values.evalConfigs }}
  {{ printf "config-%s" $name | quote }}: |
{{ $body | indent 4 }}
{{- end }}
