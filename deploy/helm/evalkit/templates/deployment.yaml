apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evalkit.fullname" . }}
  labels: {{- include "evalkit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ if .Values.persistence.enabled }}Recreate{{ else }}RollingUpdate{{ end }}
  selector:
    matchLabels: {{- include "evalkit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "evalkit.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "evalkit.serviceAccountName" . }}
      automountServiceAccountToken: {{ if .Values.serviceAccount.annotations }}true{{ else }}false{{ end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: evalkit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/evalkit/server.yaml", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          {{- include "evalkit.envFrom" . | nindent 10 }}
          {{- include "evalkit.mounts" . | nindent 10 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- include "evalkit.volumes" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
