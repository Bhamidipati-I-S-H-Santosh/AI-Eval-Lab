apiVersion: v1
kind: Service
metadata:
  name: {{ include "evalkit.fullname" . }}
  labels: {{- include "evalkit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "evalkit.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "evalkit.serviceAccountName" . }}
  labels: {{- include "evalkit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "evalkit.fullname" . }}
  labels: {{- include "evalkit.labels" . | nindent 4 }}
spec:
  accessModes: {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "evalkit.fullname" . }}
  labels: {{- include "evalkit.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "evalkit.fullname" . }}
                port: {name: http}
---
{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "evalkit.fullname" . }}
  labels: {{- include "evalkit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "evalkit.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress{{ if .Values.networkPolicy.restrictEgress }}, Egress{{ end }}]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . }}}
        {{- end }}
      ports:
        - {port: 8080, protocol: TCP}
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    - to:   # DNS
        - namespaceSelector: {}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to:
        - ipBlock: {cidr: {{ . }}}
    {{- end }}
  {{- end }}
{{- end }}
